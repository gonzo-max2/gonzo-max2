<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Nova Proof Studio</title>
  <desc id="desc">A dark technical banner showing three bounded candidates flowing into verified evidence, explicit selection, and a protected source transaction.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050607"/>
      <stop offset=".55" stop-color="#0a0d12"/>
      <stop offset="1" stop-color="#07101a"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#4c8dff" stop-opacity=".24"/>
      <stop offset="1" stop-color="#4c8dff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="26" fill="url(#grid)"/>
  <circle cx="920" cy="110" r="270" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1199" height="359" rx="25.5" fill="none" stroke="#fff" stroke-opacity=".1"/>

  <g transform="translate(58 54)">
    <rect width="184" height="28" rx="14" fill="#4c8dff" fill-opacity=".12" stroke="#72a7ff" stroke-opacity=".35"/>
    <circle cx="17" cy="14" r="4" fill="#33d69f"/>
    <text x="31" y="18.5" fill="#a9c8ff" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="800" letter-spacing="1.4">LOCAL-FIRST PROOF STUDIO</text>
    <text y="92" fill="#f4f7fb" font-family="Inter,system-ui,sans-serif" font-size="44" font-weight="850" letter-spacing="-2">AI can propose.</text>
    <text y="140" fill="#7ba8f7" font-family="Inter,system-ui,sans-serif" font-size="44" font-weight="850" letter-spacing="-2">Evidence decides.</text>
    <text y="184" fill="#92a1b5" font-family="Inter,system-ui,sans-serif" font-size="15">Three candidates → deterministic checks → explicit selection</text>
    <text y="209" fill="#92a1b5" font-family="Inter,system-ui,sans-serif" font-size="15">→ durable apply → rollback → exact Git subject</text>
    <g transform="translate(0 238)" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="750">
      <rect width="104" height="28" rx="9" fill="#fff" fill-opacity=".035" stroke="#fff" stroke-opacity=".1"/>
      <text x="17" y="18" fill="#c4cfdd">3 CANDIDATES</text>
      <rect x="114" width="118" height="28" rx="9" fill="#fff" fill-opacity=".035" stroke="#fff" stroke-opacity=".1"/>
      <text x="130" y="18" fill="#c4cfdd">EXPLICIT APPLY</text>
      <rect x="242" width="136" height="28" rx="9" fill="#33d69f" fill-opacity=".08" stroke="#33d69f" stroke-opacity=".22"/>
      <text x="258" y="18" fill="#78e4bd">ROLLBACK BOUND</text>
    </g>
  </g>

  <g transform="translate(650 64)" filter="url(#shadow)">
    <path d="M104 51H214M104 111H214M104 171H214" fill="none" stroke="#4c8dff" stroke-opacity=".38" stroke-width="2"/>
    <path d="M344 111H410" fill="none" stroke="#33d69f" stroke-opacity=".7" stroke-width="2"/>
    <g font-family="Inter,system-ui,sans-serif">
      <g>
        <rect width="104" height="42" rx="12" fill="#101722" stroke="#4c8dff" stroke-opacity=".34"/>
        <text x="16" y="18" fill="#72a7ff" font-size="9" font-weight="800">01 · MINIMAL</text>
        <text x="16" y="32" fill="#718096" font-size="8">bounded patch</text>
      </g>
      <g transform="translate(0 60)">
        <rect width="104" height="42" rx="12" fill="#14130e" stroke="#f4b860" stroke-opacity=".3"/>
        <text x="16" y="18" fill="#f4b860" font-size="9" font-weight="800">02 · TEST FIRST</text>
        <text x="16" y="32" fill="#718096" font-size="8">behavior proof</text>
      </g>
      <g transform="translate(0 120)">
        <rect width="104" height="42" rx="12" fill="#0d1513" stroke="#33d69f" stroke-opacity=".3"/>
        <text x="16" y="18" fill="#60ddb2" font-size="9" font-weight="800">03 · DESIGN</text>
        <text x="16" y="32" fill="#718096" font-size="8">system quality</text>
      </g>
      <g transform="translate(214 58)">
        <rect width="130" height="106" rx="18" fill="#0f141c" stroke="#72a7ff" stroke-opacity=".38"/>
        <path d="M43 40l17 9 27-28" fill="none" stroke="#72a7ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="26" y="75" fill="#d8e5fb" font-size="11" font-weight="850">HUMAN SELECTED</text>
        <text x="26" y="91" fill="#718096" font-size="8">fresh evidence only</text>
      </g>
      <g transform="translate(410 58)">
        <rect width="118" height="106" rx="18" fill="#0c1714" stroke="#33d69f" stroke-opacity=".4"/>
        <path d="M46 35h28v28H46z" fill="none" stroke="#65e1b7" stroke-width="3"/>
        <path d="M53 35v-7a7 7 0 0 1 14 0v7" fill="none" stroke="#65e1b7" stroke-width="3"/>
        <text x="26" y="75" fill="#bdf5df" font-size="11" font-weight="850">SOURCE WRITE</text>
        <text x="28" y="91" fill="#718096" font-size="8">transaction gated</text>
      </g>
    </g>
  </g>
</svg>
