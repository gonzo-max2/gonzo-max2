<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Nova Proof Studio</title>
  <desc id="desc">A light technical banner showing three bounded candidates flowing into verified evidence, explicit selection, and a protected source transaction.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset=".55" stop-color="#f2f6fb"/>
      <stop offset="1" stop-color="#eaf2ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#4c8dff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#4c8dff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#10233f" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="26" fill="url(#grid)"/>
  <circle cx="920" cy="110" r="270" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1199" height="359" rx="25.5" fill="none" stroke="#18365e" stroke-opacity=".15"/>
  <g transform="translate(58 54)">
    <rect width="184" height="28" rx="14" fill="#4c8dff" fill-opacity=".09" stroke="#2768d4" stroke-opacity=".28"/>
    <circle cx="17" cy="14" r="4" fill="#169b70"/>
    <text x="31" y="18.5" fill="#245fae" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="800" letter-spacing="1.4">LOCAL-FIRST PROOF STUDIO</text>
    <text y="92" fill="#102038" font-family="Inter,system-ui,sans-serif" font-size="44" font-weight="850" letter-spacing="-2">AI can propose.</text>
    <text y="140" fill="#316fcf" font-family="Inter,system-ui,sans-serif" font-size="44" font-weight="850" letter-spacing="-2">Evidence decides.</text>
    <text y="184" fill="#53647a" font-family="Inter,system-ui,sans-serif" font-size="15">Three candidates → deterministic checks → explicit selection</text>
    <text y="209" fill="#53647a" font-family="Inter,system-ui,sans-serif" font-size="15">→ durable apply → rollback → exact Git subject</text>
    <g transform="translate(0 238)" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="750">
      <rect width="104" height="28" rx="9" fill="#fff" stroke="#18365e" stroke-opacity=".14"/>
      <text x="17" y="18" fill="#43536a">3 CANDIDATES</text>
      <rect x="114" width="118" height="28" rx="9" fill="#fff" stroke="#18365e" stroke-opacity=".14"/>
      <text x="130" y="18" fill="#43536a">EXPLICIT APPLY</text>
      <rect x="242" width="136" height="28" rx="9" fill="#33d69f" fill-opacity=".08" stroke="#169b70" stroke-opacity=".24"/>
      <text x="258" y="18" fill="#137a59">ROLLBACK BOUND</text>
    </g>
  </g>
  <g transform="translate(650 64)" font-family="Inter,system-ui,sans-serif">
    <path d="M104 51H214M104 111H214M104 171H214" fill="none" stroke="#2768d4" stroke-opacity=".3" stroke-width="2"/>
    <path d="M344 111H410" fill="none" stroke="#169b70" stroke-opacity=".55" stroke-width="2"/>
    <g>
      <rect width="104" height="42" rx="12" fill="#fff" stroke="#2768d4" stroke-opacity=".25"/>
      <text x="16" y="18" fill="#2768d4" font-size="9" font-weight="800">01 · MINIMAL</text>
      <text x="16" y="32" fill="#6c7d93" font-size="8">bounded patch</text>
    </g>
    <g transform="translate(0 60)">
      <rect width="104" height="42" rx="12" fill="#fffdf8" stroke="#bf7a17" stroke-opacity=".26"/>
      <text x="16" y="18" fill="#9c630f" font-size="9" font-weight="800">02 · TEST FIRST</text>
      <text x="16" y="32" fill="#6c7d93" font-size="8">behavior proof</text>
    </g>
    <g transform="translate(0 120)">
      <rect width="104" height="42" rx="12" fill="#f7fdfa" stroke="#169b70" stroke-opacity=".26"/>
      <text x="16" y="18" fill="#137a59" font-size="9" font-weight="800">03 · DESIGN</text>
      <text x="16" y="32" fill="#6c7d93" font-size="8">system quality</text>
    </g>
    <g transform="translate(214 58)">
      <rect width="130" height="106" rx="18" fill="#fff" stroke="#2768d4" stroke-opacity=".28"/>
      <path d="M43 40l17 9 27-28" fill="none" stroke="#2768d4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="75" fill="#213a5d" font-size="11" font-weight="850">HUMAN SELECTED</text>
      <text x="26" y="91" fill="#6c7d93" font-size="8">fresh evidence only</text>
    </g>
    <g transform="translate(410 58)">
      <rect width="118" height="106" rx="18" fill="#f6fdf9" stroke="#169b70" stroke-opacity=".3"/>
      <path d="M46 35h28v28H46z" fill="none" stroke="#169b70" stroke-width="3"/>
      <path d="M53 35v-7a7 7 0 0 1 14 0v7" fill="none" stroke="#169b70" stroke-width="3"/>
      <text x="26" y="75" fill="#175e49" font-size="11" font-weight="850">SOURCE WRITE</text>
      <text x="28" y="91" fill="#6c7d93" font-size="8">transaction gated</text>
    </g>
  </g>
</svg>
