name: Refresh profile Aegis version

on:
  push:
    branches:
      - agent/profile-cv-evidence
    paths:
      - .github/workflows/refresh-profile-version.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bind public profile to current Aegis version
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for name in ('README.md', 'docs/profile.html'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              count = text.count('0.10.1')
              if count == 0:
                  raise SystemExit(f'Expected 0.10.1 reference in {name}')
              path.write_text(text.replace('0.10.1', '0.10.4'), encoding='utf-8')
              print(f'{name}: updated {count} version reference(s)')
          PY

      - name: Commit profile version correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/profile.html
          git commit -m "Align public profile with Aegis 0.10.4"
          git push origin "HEAD:${GITHUB_REF_NAME}"
